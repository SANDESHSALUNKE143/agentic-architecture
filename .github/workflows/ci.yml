name: sdk-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '.[dev,runtime,service,providers,telemetry,frameworks]'
      - run: ruff format --check .
      - run: ruff check .
      - run: python deployment/scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python examples/minimal.py
      - run: python examples/frameworks.py
      - run: python tests/evaluation/run.py
      - run: python deployment/scripts/validate_config.py
      - run: python -m build
      - run: docker compose config --quiet
