<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">How one brief becomes an answer</title>
  <desc id="desc">The console sends a brief through entry and guardrails. The workflow router picks an agent list. LangGraph runs one specialist at a time through LangChain and the gateway. A write waits for another actor. After the last agent, the response is the answer and a worker stores the trace without the question.</desc>
  <rect width="1200" height="820" fill="#f7f4ee"/>
  <g font-family="Georgia, Palatino, serif" fill="#1c2430">
    <text x="40" y="42" font-size="30" font-weight="700" fill="#1f4b3a">Multi-agent</text>
    <text x="240" y="40" font-size="16" fill="#5c564c">Specialists stay in order.</text>
    <text x="40" y="68" font-size="14" fill="#5c564c">LangGraph is the sequence. LangChain is the loop inside one agent. A failed step does not replan.</text>

    <rect x="40" y="92" width="200" height="96" rx="12" fill="#fff" stroke="#1c2430"/>
    <text x="56" y="126" font-size="16">Console</text>
    <text x="56" y="150" font-size="13" fill="#5c564c">ui/admin-dashboard</text>
    <text x="56" y="170" font-size="13" fill="#5c564c">Brief, then Send</text>

    <rect x="276" y="92" width="210" height="96" rx="12" fill="#fff" stroke="#1c2430"/>
    <circle cx="298" cy="116" r="12" fill="#3d4f7c"/>
    <text x="298" y="121" text-anchor="middle" font-size="12" fill="#fff">1</text>
    <text x="318" y="122" font-size="16">01-entry</text>
    <text x="292" y="150" font-size="13" fill="#5c564c">body, token, rate</text>
    <text x="292" y="170" font-size="13" fill="#5c564c">API on port 8090</text>

    <rect x="522" y="92" width="250" height="96" rx="12" fill="#fff" stroke="#1c2430"/>
    <circle cx="544" cy="116" r="12" fill="#2a6f8f"/>
    <text x="544" y="121" text-anchor="middle" font-size="12" fill="#fff">2</text>
    <text x="564" y="122" font-size="16">02-guardrails</text>
    <text x="538" y="150" font-size="13" fill="#5c564c">task size, hop, handoff</text>
    <text x="538" y="170" font-size="13" fill="#5c564c">strip untrusted lines</text>

    <rect x="808" y="92" width="352" height="96" rx="12" fill="#e7f2ec" stroke="#1f4b3a" stroke-width="1.5"/>
    <circle cx="830" cy="116" r="12" fill="#1f4b3a"/>
    <text x="830" y="121" text-anchor="middle" font-size="12" fill="#fff">3</text>
    <text x="850" y="122" font-size="16">03-workflows</text>
    <text x="824" y="150" font-size="13" fill="#5c564c">router picks one list</text>
    <text x="824" y="170" font-size="13" fill="#5c564c">LangGraph steps that list</text>

    <rect x="40" y="220" width="1120" height="132" rx="14" fill="#fff" stroke="#1f4b3a"/>
    <text x="56" y="248" font-size="15" fill="#1f4b3a">Agent order. One name at a time. The next agent receives the same task.</text>
    <text x="56" y="278" font-size="14">product-discovery</text>
    <text x="240" y="278" font-size="14" fill="#5c564c">shopping → catalog → inventory</text>
    <text x="56" y="304" font-size="14">customer-support</text>
    <text x="240" y="304" font-size="14" fill="#5c564c">support → billing</text>
    <text x="56" y="330" font-size="14">order-processing</text>
    <text x="240" y="330" font-size="14" fill="#5c564c">order → billing</text>
    <text x="640" y="278" font-size="14" fill="#5c564c">A phrase, a workflow name,</text>
    <text x="640" y="302" font-size="14" fill="#5c564c">or an agents list selects it.</text>
    <text x="640" y="330" font-size="14" fill="#8a5a2a">billing, research, and data-analysis can run alone.</text>

    <text x="220" y="384" font-size="14" fill="#5c564c">Inside this specialist. LangGraph then takes the next name, or the answer is projected.</text>

    <rect x="40" y="396" width="270" height="168" rx="12" fill="#f8ead6" stroke="#8a5a2a"/>
    <circle cx="62" cy="422" r="12" fill="#1f4b3a"/>
    <text x="62" y="427" text-anchor="middle" font-size="12" fill="#fff">4</text>
    <text x="82" y="428" font-size="16">04-loops</text>
    <text x="56" y="456" font-size="13" fill="#5c564c">this agent's agent.yaml</text>
    <text x="56" y="478" font-size="13" fill="#5c564c">LangChain create_agent</text>
    <text x="56" y="500" font-size="13" fill="#5c564c">mock, or ChatOpenAI</text>
    <text x="56" y="528" font-size="13" fill="#8a5a2a">notes only if rag.retrieve</text>
    <text x="56" y="548" font-size="13" fill="#8a5a2a">capture only if rag.capture</text>

    <rect x="350" y="396" width="300" height="168" rx="12" fill="#1f4b3a"/>
    <circle cx="372" cy="422" r="12" fill="#f7f4ee"/>
    <text x="372" y="427" text-anchor="middle" font-size="12" fill="#1f4b3a">5</text>
    <text x="392" y="428" font-size="16" fill="#f7f4ee">05-tools gateway</text>
    <text x="366" y="456" font-size="13" fill="#d7ebe3">only tools on the contract</text>
    <text x="366" y="478" font-size="13" fill="#d7ebe3">permission and connection</text>
    <text x="366" y="500" font-size="13" fill="#d7ebe3">a read can be reused 30s</text>
    <text x="366" y="528" font-size="13" fill="#f8ead6">a write pauses</text>
    <text x="366" y="548" font-size="13" fill="#f8ead6">another actor approves</text>

    <rect x="690" y="396" width="200" height="168" rx="12" fill="#fff" stroke="#8a5a2a" stroke-dasharray="6 4"/>
    <text x="706" y="440" font-size="16">mocks/merchant</text>
    <text x="706" y="466" font-size="13" fill="#5c564c">outside the platform</text>
    <text x="706" y="488" font-size="13" fill="#5c564c">MCP on port 8091</text>
    <text x="706" y="518" font-size="13" fill="#5c564c">the tool calls it</text>

    <rect x="930" y="396" width="230" height="168" rx="12" fill="#e7f2ec" stroke="#1f4b3a" stroke-width="1.5"/>
    <circle cx="952" cy="422" r="12" fill="#1f4b3a"/>
    <text x="952" y="427" text-anchor="middle" font-size="12" fill="#fff">8</text>
    <text x="972" y="428" font-size="16" fill="#1f4b3a">08-response</text>
    <text x="946" y="460" font-size="13" fill="#5c564c">after the last agent</text>
    <text x="946" y="482" font-size="13" fill="#5c564c">schema per agent</text>
    <text x="946" y="512" font-size="13" fill="#5c564c">a miss fails that agent</text>
    <text x="946" y="544" font-size="16" fill="#1f4b3a">Answer</text>

    <rect x="40" y="640" width="1120" height="140" rx="14" fill="#fff" stroke="#8a5a2a" stroke-dasharray="7 5"/>
    <text x="56" y="668" font-size="13" fill="#8a5a2a">After the run. The record does not include the question and does not change model weights.</text>
    <rect x="56" y="688" width="280" height="68" rx="10" fill="#fff" stroke="#8a5a2a"/>
    <circle cx="78" cy="722" r="12" fill="#8a5a2a"/>
    <text x="78" y="727" text-anchor="middle" font-size="12" fill="#fff">6</text>
    <text x="98" y="716" font-size="16">06-jobs</text>
    <text x="98" y="738" font-size="13" fill="#5c564c">enqueue stage and score</text>
    <rect x="372" y="688" width="560" height="68" rx="10" fill="#fff" stroke="#8a5a2a"/>
    <circle cx="394" cy="722" r="12" fill="#8a5a2a"/>
    <text x="394" y="727" text-anchor="middle" font-size="12" fill="#fff">7</text>
    <text x="414" y="716" font-size="16">07-observability</text>
    <text x="414" y="738" font-size="13" fill="#5c564c">agent, tool, status, duration</text>
  </g>

  <g fill="none" stroke="#1c2430" stroke-width="1.7">
    <path d="M240 140 H276" marker-end="url(#ma)"/>
    <path d="M486 140 H522" marker-end="url(#ma)"/>
    <path d="M772 140 H808" marker-end="url(#ma)"/>
    <path d="M984 188 V220" marker-end="url(#ma)"/>
    <path d="M175 352 V396" marker-end="url(#ma)"/>
    <path d="M310 480 H350" marker-end="url(#ma)"/>
    <path d="M650 480 H690" marker-end="url(#ma)"/>
    <path d="M890 480 H930" marker-end="url(#ma)"/>
    <path d="M1045 564 V688" stroke="#8a5a2a" stroke-dasharray="5 4" marker-end="url(#ma-gold)"/>
    <path d="M336 722 H372" stroke="#8a5a2a" marker-end="url(#ma-gold)"/>
  </g>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c2430"/>
    </marker>
    <marker id="ma-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5a2a"/>
    </marker>
  </defs>
</svg>
