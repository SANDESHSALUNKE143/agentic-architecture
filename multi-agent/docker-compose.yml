# One server. The API and the console are the platform.
# agentic-merchant is the mock store, not part of the API image.
# agentic-console is the only published port.
# GET /platform on the console port returns the same map.

name: agentic-architecture

services:
  merchant:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.merchant
    image: agentic-merchant
    environment:
      MERCHANT_MCP_HOST: 0.0.0.0
      MERCHANT_MCP_PORT: "8091"
    expose:
      - "8091"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8091), 2).close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    image: agentic-api
    depends_on:
      merchant:
        condition: service_healthy
    environment:
      PLATFORM_BIND_HOST: 0.0.0.0
      PLATFORM_BIND_PORT: "8090"
      PLATFORM_ENV: ${PLATFORM_ENV:-development}
      PLATFORM_DEV_TOKEN: ${PLATFORM_DEV_TOKEN:-local-dev-token-not-for-production}
      PLATFORM_LLM_MODE: ${PLATFORM_LLM_MODE:-mock}
      PLATFORM_TIMEOUT_SECONDS: ${PLATFORM_TIMEOUT_SECONDS:-8}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      PLATFORM_DATA_DIR: /var/lib/agentic
      MERCHANT_MCP_URL: http://merchant:8091/mcp
      # Empty on the small stack. The dependency env file fills these in.
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OBSERVABILITY_LOG_URL: ${OBSERVABILITY_LOG_URL:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_TOKEN: ${N8N_TOKEN:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEO4J_URL: ${NEO4J_URL:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      SQL_CONNECTION: ${SQL_CONNECTION:-}
    volumes:
      - agentic-data:/var/lib/agentic
    expose:
      - "8090"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; token=os.environ.get('PLATFORM_DEV_TOKEN','local-dev-token-not-for-production'); req=urllib.request.Request('http://127.0.0.1:8090/health', headers={'Authorization':'Bearer '+token}); urllib.request.urlopen(req, timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    labels:
      org.agentic.perception: agentic/01-entry
      org.agentic.planning: agentic/03-workflows
      org.agentic.foundation_model: agentic/04-loops/llm
      org.agentic.memory: agentic/04-loops/memory
      org.agentic.action: agentic/05-tools/mcp/tool-gateway
      org.agentic.learning: agentic/07-observability
      org.agentic.communication: agentic/08-response
      org.agentic.security: agentic/02-guardrails
      org.agentic.observability: agentic/07-observability
      org.agentic.jobs: agentic/06-jobs

  console:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.console
    image: agentic-console
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      org.agentic.communication: ui/admin-dashboard
      org.agentic.published: "true"

volumes:
  agentic-data:
