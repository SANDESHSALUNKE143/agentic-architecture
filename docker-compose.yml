# One server, two images.
# agentic-api holds the seven steps, security, and observability.
# agentic-console is the only published port.
# GET /platform on the console port returns the same map.

name: agentic-architecture

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    image: agentic-api
    environment:
      PLATFORM_BIND_HOST: 0.0.0.0
      PLATFORM_BIND_PORT: "8090"
      PLATFORM_ENV: ${PLATFORM_ENV:-development}
      PLATFORM_DEV_TOKEN: ${PLATFORM_DEV_TOKEN:-local-dev-token-not-for-production}
      PLATFORM_LLM_MODE: ${PLATFORM_LLM_MODE:-mock}
      PLATFORM_DATA_DIR: /var/lib/agentic
    volumes:
      - agentic-data:/var/lib/agentic
    expose:
      - "8090"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; token=os.environ.get('PLATFORM_DEV_TOKEN','local-dev-token-not-for-production'); req=urllib.request.Request('http://127.0.0.1:8090/health', headers={'Authorization':'Bearer '+token}); urllib.request.urlopen(req, timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    labels:
      org.agentic.perception: agentic/01-entry
      org.agentic.planning: agentic/03-workflows
      org.agentic.foundation_model: agentic/04-loops/llm
      org.agentic.memory: agentic/04-loops/memory
      org.agentic.action: agentic/05-tools/mcp/tool-gateway
      org.agentic.learning: agentic/07-observability
      org.agentic.communication: agentic/08-response
      org.agentic.security: agentic/02-guardrails
      org.agentic.observability: agentic/07-observability
      org.agentic.jobs: agentic/06-jobs

  console:
    build:
      context: .
      dockerfile: deploy/Dockerfile.console
    image: agentic-console
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      org.agentic.communication: ui/admin-dashboard
      org.agentic.published: "true"

volumes:
  agentic-data:
