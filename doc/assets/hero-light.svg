<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="The problem: every new agent was copying the run loop, guardrails, connectors, and traces. The SDK sits in the middle. Its role is to run decide, tool, and answer, enforce permission, allowlist, rate, and quota, and record one trace without the prompt. It uses read-only SQL, Qdrant, Neo4j, a model, and allowlisted web. You consume it so the next agent imports one package. Instructions, screens, and the choice of database stay in the agent. The operator only watches.">
  <title>Build the agent. Import the platform.</title>
  <defs>
    <marker id="af-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ink{fill:#0F172A}
      .mut{fill:#64748B}
      .faint{fill:#94A3B8}
      .flow{animation:af-dash 2.4s linear infinite}
      .live{animation:af-live 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes af-dash{to{stroke-dashoffset:-26}}
      @keyframes af-live{0%,100%{opacity:1}50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){.flow,.live{animation:none}}
    </style>
    <symbol id="i-doc" viewBox="0 0 24 24">
      <rect x="5" y="3" width="14" height="18" rx="2" fill="#fff" stroke="#2563EB" stroke-width="1.6"/>
      <path d="M8 8h8M8 12h8M8 16h5" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-loop" viewBox="0 0 24 24">
      <path d="M7 10a5 5 0 1 1 1.2 6" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M7 13V8H12" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-box" viewBox="0 0 24 24">
      <path d="M4 8l8-4 8 4-8 4-8-4z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M4 8v8l8 4 8-4V8" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M12 12v8" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    </symbol>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="499" rx="18" fill="#FFFFFF" stroke="#C3CCD9"/>

  <circle class="live" cx="32" cy="34" r="4" fill="#059669"/>
  <text class="mono" x="46" y="38" font-size="10" font-weight="700" letter-spacing=".16em" fill="#64748B">AGENTIC FOUNDATION</text>
  <text class="sans ink" x="28" y="68" font-size="24" font-weight="700" letter-spacing="-0.03em">Build the agent. Import the platform.</text>
  <text class="sans mut" x="28" y="92" font-size="13">The SDK is the shared middle. Your agent keeps the business.</text>

  <rect x="28" y="108" width="904" height="40" rx="10" fill="#FFF1F2" stroke="#FECDD3"/>
  <text class="sans" x="44" y="133" font-size="13" font-weight="600" fill="#9F1239">The problem. Every new agent was copying the run loop, the guardrails, the connectors, and the traces.</text>

  <!-- your agent -->
  <rect x="28.5" y="164.5" width="230" height="286" rx="14" fill="#F7F9FC" stroke="#D3DBE6"/>
  <use href="#i-doc" x="46" y="180" width="22" height="22"/>
  <text class="mono" x="76" y="196" font-size="9" font-weight="700" letter-spacing=".14em" fill="#64748B">YOUR AGENT</text>
  <text class="sans ink" x="46" y="228" font-size="16" font-weight="700">What you still write</text>
  <text class="sans mut" x="46" y="258" font-size="13">Instructions and screens</text>
  <text class="sans mut" x="46" y="282" font-size="13">Domain tools and evidence</text>
  <text class="sans mut" x="46" y="306" font-size="13">Which database to open</text>
  <text class="sans mut" x="46" y="330" font-size="13">Which vector store to open</text>
  <line x1="46" y1="354" x2="240" y2="354" stroke="#E2E8F0"/>
  <text class="sans ink" x="46" y="380" font-size="12" font-weight="600">The business stays here.</text>
  <text class="sans mut" x="46" y="402" font-size="12">The SDK does not own it.</text>
  <text class="sans mut" x="46" y="426" font-size="12">Another agent imports</text>
  <text class="sans mut" x="46" y="444" font-size="12">the same package.</text>

  <!-- sdk -->
  <rect x="286.5" y="164.5" width="388" height="286" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <use href="#i-loop" x="304" y="180" width="22" height="22"/>
  <text class="mono" x="334" y="196" font-size="9" font-weight="700" letter-spacing=".14em" fill="#2563EB">THE SDK · WHERE IT FITS</text>
  <text class="sans ink" x="304" y="228" font-size="16" font-weight="700">Its role</text>

  <rect x="304" y="242" width="78" height="26" rx="8" fill="#DBEAFE"/>
  <text class="sans" x="343" y="259" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">decide</text>
  <rect x="396" y="242" width="78" height="26" rx="8" fill="#DBEAFE"/>
  <text class="sans" x="435" y="259" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">tool</text>
  <rect x="488" y="242" width="78" height="26" rx="8" fill="#D1FAE5"/>
  <text class="sans" x="527" y="259" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">answer</text>
  <path class="flow" d="M382 255 H396 M474 255 H488" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 4"/>

  <text class="sans mut" x="304" y="292" font-size="12.5">Enforces permission, allowlist, rate, and quota.</text>
  <text class="sans mut" x="304" y="312" font-size="12.5">Stops an answer until required tools have run.</text>
  <text class="sans mut" x="304" y="332" font-size="12.5">Records one trace. The prompt stays out.</text>

  <text class="mono" x="304" y="360" font-size="9" font-weight="700" letter-spacing=".14em" fill="#64748B">WHAT IT USES</text>
  <g class="sans" font-size="12" font-weight="600" fill="#0F172A">
    <rect x="304" y="372" width="64" height="26" rx="8" fill="#F8FAFC" stroke="#D3DBE6"/>
    <text x="336" y="389" text-anchor="middle">SQL</text>
    <rect x="376" y="372" width="78" height="26" rx="8" fill="#F8FAFC" stroke="#D3DBE6"/>
    <text x="415" y="389" text-anchor="middle">Qdrant</text>
    <rect x="462" y="372" width="72" height="26" rx="8" fill="#F8FAFC" stroke="#D3DBE6"/>
    <text x="498" y="389" text-anchor="middle">Neo4j</text>
    <rect x="542" y="372" width="68" height="26" rx="8" fill="#F8FAFC" stroke="#D3DBE6"/>
    <text x="576" y="389" text-anchor="middle">Model</text>
  </g>
  <rect x="304" y="406" width="120" height="26" rx="8" fill="#F8FAFC" stroke="#D3DBE6"/>
  <text class="sans ink" x="364" y="423" font-size="12" font-weight="600" text-anchor="middle">Allowlisted web</text>

  <!-- why -->
  <rect x="702.5" y="164.5" width="230" height="286" rx="14" fill="#F0FDF4" stroke="#A7F3D0"/>
  <use href="#i-box" x="720" y="180" width="22" height="22"/>
  <text class="mono" x="750" y="196" font-size="9" font-weight="700" letter-spacing=".14em" fill="#059669">WHY CONSUME IT</text>
  <text class="sans ink" x="720" y="228" font-size="16" font-weight="700">One package</text>
  <text class="sans mut" x="720" y="258" font-size="13">Do not copy the loop</text>
  <text class="sans mut" x="720" y="282" font-size="13">Guardrails are already on</text>
  <text class="sans mut" x="720" y="306" font-size="13">Connectors stay bounded</text>
  <text class="sans mut" x="720" y="330" font-size="13">A fix is a version bump</text>
  <line x1="720" y1="354" x2="912" y2="354" stroke="#BBF7D0"/>
  <text class="sans ink" x="720" y="380" font-size="12" font-weight="600">The operator only watches.</text>
  <text class="sans mut" x="720" y="402" font-size="12">Roster, servers, limits.</text>
  <text class="sans mut" x="720" y="426" font-size="12">It does not edit the agent</text>
  <text class="sans mut" x="720" y="444" font-size="12">and it does not own the data.</text>

  <path class="flow" d="M259 300 H286" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#af-arrow)"/>
  <circle r="3.2" fill="#2563EB">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M259 300 H278"/>
  </circle>
</svg>
