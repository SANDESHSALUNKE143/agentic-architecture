[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-agent"
version = "0.1.0"
description = "Reference agent. Business fixtures stay in this folder."
requires-python = ">=3.11"
dependencies = [
  "agentic-foundation-sdk",
  "neo4j>=5.26,<6",
]

[tool.setuptools]
packages = [
  "insight_agent",
  "insight_agent.perception",
  "insight_agent.cognition",
  "insight_agent.action",
  "insight_agent.environment",
  "insight_agent.learning",
  "insight_agent.communication",
  "insight_agent.host",
]

[tool.setuptools.package-dir]
"insight_agent" = "."
"insight_agent.perception" = "perception"
"insight_agent.cognition" = "cognition"
"insight_agent.action" = "action"
"insight_agent.environment" = "environment"
"insight_agent.learning" = "learning"
"insight_agent.communication" = "communication"
"insight_agent.host" = "host"

[tool.setuptools.package-data]
"insight_agent.host" = ["product.html"]
