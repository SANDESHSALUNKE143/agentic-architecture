name: agentic-prototype
services:
  demo:
    build: .
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
  postgres:
    image: postgres:16.4
    profiles: [data]
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    mem_limit: 2g
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform -d agentic"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: [data]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    mem_limit: 4g
    cpus: 1.0
    logging: *logging
  collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    profiles: [telemetry]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]
    mem_limit: 512m
    cpus: 0.5
    logging: *logging
volumes:
  pgdata:
  qdrant:
