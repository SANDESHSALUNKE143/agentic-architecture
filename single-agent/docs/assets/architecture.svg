<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
  <title id="title">How one brief becomes an answer</title>
  <desc id="desc">One desk-agent. The request walks 01-entry, 02-guardrails, 03-harness, 04-loops, 05-tools, 06-jobs, 07-observability, and 08-response. One harness adapter runs.</desc>
  <rect width="1100" height="780" fill="#f7f4ee"/>
  <g font-family="Georgia, serif" fill="#1c2430">
    <text x="720" y="64" font-size="36" fill="#1f4b3a" font-weight="700">Single agent</text>
    <text x="720" y="100" font-size="16" fill="#5c564c">One brief. One harness.</text>

    <g>
      <circle cx="70" cy="70" r="16" fill="#6b4c9a"/>
      <text x="70" y="75" text-anchor="middle" font-size="14" fill="#fff">1</text>
      <rect x="100" y="48" width="520" height="44" rx="10" fill="#fff" stroke="#1c2430"/>
      <text x="118" y="76" font-size="16">01-entry</text>
      <text x="240" y="76" font-size="14" fill="#5c564c">task, user, session</text>
    </g>
    <g>
      <circle cx="70" cy="140" r="16" fill="#6b4c9a"/>
      <text x="70" y="145" text-anchor="middle" font-size="14" fill="#fff">2</text>
      <rect x="100" y="118" width="520" height="44" rx="10" fill="#fff" stroke="#1c2430"/>
      <text x="118" y="146" font-size="16">02-guardrails</text>
      <text x="280" y="146" font-size="14" fill="#5c564c">auth, limits, strip untrusted lines</text>
    </g>
    <g>
      <circle cx="70" cy="250" r="16" fill="#1f4b3a"/>
      <text x="70" y="255" text-anchor="middle" font-size="14" fill="#fff">3</text>
      <rect x="100" y="188" width="520" height="164" rx="10" fill="#f3f7f4" stroke="#1f4b3a" stroke-width="1.5"/>
      <text x="118" y="216" font-size="16">03-harness</text>
      <text x="230" y="216" font-size="14" fill="#5c564c">settings pick one adapter</text>
      <rect x="118" y="232" width="480" height="32" rx="6" fill="#fff" stroke="#1c2430"/>
      <text x="132" y="253" font-size="14">langchain.py</text>
      <text x="280" y="253" font-size="13" fill="#5c564c">offline. create_agent</text>
      <rect x="118" y="272" width="480" height="32" rx="6" fill="#fff" stroke="#1f4b3a"/>
      <text x="132" y="293" font-size="14">claude.py</text>
      <text x="250" y="293" font-size="13" fill="#5c564c">live. Claude Agent SDK</text>
      <rect x="118" y="312" width="480" height="32" rx="6" fill="#fff" stroke="#8a5a2a"/>
      <text x="132" y="333" font-size="14">deepagent.py</text>
      <text x="280" y="333" font-size="13" fill="#5c564c">shadow. Deep Agents</text>
    </g>
    <g>
      <circle cx="70" cy="400" r="16" fill="#6b4c9a"/>
      <text x="70" y="405" text-anchor="middle" font-size="14" fill="#fff">4</text>
      <rect x="100" y="378" width="520" height="44" rx="10" fill="#fff" stroke="#1c2430"/>
      <text x="118" y="406" font-size="16">04-loops</text>
      <text x="230" y="406" font-size="14" fill="#5c564c">desk-agent.yaml, session, model</text>
    </g>
    <g>
      <circle cx="70" cy="470" r="16" fill="#6b4c9a"/>
      <text x="70" y="475" text-anchor="middle" font-size="14" fill="#fff">5</text>
      <rect x="100" y="448" width="520" height="44" rx="10" fill="#fff" stroke="#1c2430"/>
      <text x="118" y="476" font-size="16">05-tools</text>
      <text x="220" y="476" font-size="14" fill="#5c564c">gateway. search, details, compare, stock</text>
    </g>
    <g>
      <circle cx="70" cy="540" r="16" fill="#6b4c9a"/>
      <text x="70" y="545" text-anchor="middle" font-size="14" fill="#fff">6</text>
      <rect x="100" y="518" width="520" height="44" rx="10" fill="#fff" stroke="#1c2430"/>
      <text x="118" y="546" font-size="16">06-jobs</text>
      <text x="220" y="546" font-size="14" fill="#5c564c">enqueue the trace</text>
    </g>
    <g>
      <circle cx="70" cy="610" r="16" fill="#6b4c9a"/>
      <text x="70" y="615" text-anchor="middle" font-size="14" fill="#fff">7</text>
      <rect x="100" y="588" width="520" height="44" rx="10" fill="#fff" stroke="#1c2430"/>
      <text x="118" y="616" font-size="16">07-observability</text>
      <text x="310" y="616" font-size="14" fill="#5c564c">agent, tool, status, duration, harness</text>
    </g>
    <g>
      <circle cx="70" cy="680" r="16" fill="#6b4c9a"/>
      <text x="70" y="685" text-anchor="middle" font-size="14" fill="#fff">8</text>
      <rect x="100" y="658" width="520" height="44" rx="10" fill="#fff" stroke="#1c2430"/>
      <text x="118" y="686" font-size="16">08-response</text>
      <text x="260" y="686" font-size="14" fill="#5c564c">schema and the model reply</text>
    </g>
  </g>
</svg>
