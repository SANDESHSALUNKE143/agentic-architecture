[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "single-agent"
version = "1.0.0"
description = "One agent and a pluggable harness"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "langchain>=1.0,<2",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.0,<2",
]

[project.optional-dependencies]
dev = ["ruff==0.17.1"]
deep = ["deepagents"]
claude = ["claude-agent-sdk"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic*"]

[tool.ruff]
line-length = 100
src = ["agentic", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
