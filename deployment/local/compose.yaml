name: agentic-agentn-local
services:
  agentn:
    image: agentic-agentn:0.3.0-local
    build:
      context: ../..
      dockerfile: deployment/local/Dockerfile.agentn
      additional_contexts:
        agentn: ${AGENTN_SOURCE:?Set AGENTN_SOURCE to the consumer checkout}
    ports: ["127.0.0.1:8010:8010"]
    environment:
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?Set a random token of at least 32 characters}
      AGENT_CONFIG: config/agentn-demo.json
      AGENTN_BACKEND: demo
    volumes: ["run_metadata:/state"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  run_metadata:
