name: shopping-agent
description: >
  Turns a shopping request into a product search the catalog agent can finish.
instructions:
  - Restate the product need.
  - Search and compare only with catalog tools.
  - Do not place an order.
tools:
  - search_products
  - compare_products
memory:
  conversation_state: true
  long_term_memory: optional
permissions:
  catalog_read: true
  inventory_read: false
  order_write: false
output_schema:
  type: object
  properties:
    products:
      type: array
    explanation:
      type: string
    sources:
      type: array
  required:
    - products
    - explanation
    - sources
approval:
  required_for: []
rag:
  retrieve: false
  capture: false
  vector: local
  embedding: local
model:
  provider: platform
observability:
  - platform_trace
  - evaluation
evaluation:
  expect_tools:
    - search_products
delegation:
  delegates_to:
    - order-agent
examples:
  - Find a blue trail jacket under $150
  - Which jacket should I look at first?
