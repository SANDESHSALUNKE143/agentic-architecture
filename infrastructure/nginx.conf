server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The console is the published page. These paths are the private API.
    location ~ ^/(health|agents|agent-runs|approvals|tools|plugins|guide|settings|memory|platform|docs|redoc|openapi\.json)(/|$) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_host api:8090;
        proxy_pass http://$api_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
